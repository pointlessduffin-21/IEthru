services:
  remote-browser:
    build: .
    container_name: remote-browser-proxy
    ports:
      - "5001:5000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
      - APP_ENV=prod
    restart: unless-stopped
    # Required for Chromium to work properly
    shm_size: '2gb'
    security_opt:
      - seccomp=unconfined
